name: 🧪 Comprehensive Test Suite (API, Unit, Threshold, Vulnerability)

on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main, develop, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-testing-suite:
    name: ⚡ API, Unit, Threshold & Vulnerability Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install Testing Dependencies
        run: |
          cd testing
          npm install

      - name: 🧪 Run All 240 Tests
        run: |
          cd testing
          node run-all.js
        continue-on-error: true

      - name: 📤 Upload Excel & HTML Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: master-test-reports-${{ github.run_number }}
          path: |
            testing/reports/Excel/POPC_Master_Test_Report.xlsx
            testing/reports/HTML/execution-report.html
          retention-days: 30

      - name: 🌐 Publish Reports to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main' && always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./testing/reports
          destination_dir: master-reports/latest
          keep_files: true
        continue-on-error: true
