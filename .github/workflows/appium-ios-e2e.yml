name: 📱 Appium iOS E2E Tests — POPC Mobile Application

on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main, develop, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  NODE_VERSION: '20'

jobs:
  appium-ios-e2e:
    name: '📱 iOS Appium E2E Pipeline'
    runs-on: macos-latest

    steps:
      # Stage 1: Checkout Repository
      - name: 'Stage 1 — 🛎️ Checkout Repository'
        uses: actions/checkout@v4

      # Stage 2: Setup Node.js
      - name: 'Stage 2 — 🟢 Setup Node.js'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Stage 3: Setup Java
      - name: 'Stage 3 — ☕ Setup Java Development Kit'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Stage 4: Install Dependencies
      - name: 'Stage 4 — 📦 Install Dependencies'
        run: |
          cd appium-tests
          npm install

      # Stage 5: Xcode Check
      - name: 'Stage 5 — 🛠️ Check Xcode Environment'
        run: |
          xcodebuild -version || true
          xcrun simctl list devices || true
        continue-on-error: true

      # Stage 6: Execute Appium E2E Tests
      - name: 'Stage 6 — 🧪 Execute Appium iOS E2E Test Suite'
        run: |
          cd appium-tests
          node runners/testRunner.js --suite=all
        continue-on-error: true

      # Stage 7: Generate Reports
      - name: 'Stage 7 — 📊 Generate Reports'
        if: always()
        run: |
          cd appium-tests
          node utils/generateReports.js
        continue-on-error: true

      # Stage 8: Upload Artifacts
      - name: 'Stage 8 — 📤 Upload Test Reports'
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appium-ios-reports-${{ github.run_number }}
          path: |
            appium-tests/reports/
            appium-tests/screenshots/
          retention-days: 30

      # Stage 9: Publish to GitHub Pages
      - name: 'Stage 9 — 🌐 Publish Reports to GitHub Pages'
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main' && always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./appium-tests/reports
          destination_dir: ios-reports/latest
          keep_files: true
        continue-on-error: true
