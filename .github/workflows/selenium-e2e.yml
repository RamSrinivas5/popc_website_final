name: 🧪 Selenium E2E Tests — POPC Web Application

on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main, develop, master]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1-5'   # Mon–Fri 6 AM UTC

env:
  NODE_VERSION: '20'
  BASE_URL: 'http://localhost:5173'
  API_URL: 'http://localhost:8000'
  BROWSER: 'chrome'
  HEADLESS: 'true'
  TEST_USERNAME: ${{ secrets.TEST_USERNAME || 'testdoctor' }}
  TEST_PASSWORD: ${{ secrets.TEST_PASSWORD || 'TestPass@123' }}

jobs:
  # ────────────────────────────────────────────────────────
  # STAGE 1: Setup & Lint
  # ────────────────────────────────────────────────────────
  setup:
    name: '📦 Install Dependencies'
    runs-on: ubuntu-latest
    outputs:
      node-cache-hit: ${{ steps.cache.outputs.cache-hit }}
    steps:
      - name: '🛎️ Checkout Repository'
        uses: actions/checkout@v4

      - name: '⚙️ Setup Node.js ${{ env.NODE_VERSION }}'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: selenium-tests/package-lock.json

      - name: '📦 Install Selenium Dependencies'
        run: npm ci --prefix selenium-tests || npm install --prefix selenium-tests

      - name: '📦 Install Web App Dependencies'
        run: npm ci --prefix popc-web || npm install --prefix popc-web

  # ────────────────────────────────────────────────────────
  # STAGE 2: Build Web App
  # ────────────────────────────────────────────────────────
  build:
    name: '🔨 Build Web Application'
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: '📦 Install Dependencies'
        run: |
          npm ci --prefix popc-web 2>/dev/null || npm install --prefix popc-web

      - name: '🔨 Build Vite App'
        run: npm run build --prefix popc-web
        continue-on-error: true

      - name: '📤 Upload Build Artifacts'
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-build
          path: popc-web/dist/
          retention-days: 7

  # ────────────────────────────────────────────────────────
  # STAGE 3: E2E Tests
  # ────────────────────────────────────────────────────────
  e2e-tests:
    name: '🧪 Run Selenium E2E Tests'
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        suite: [auth, patients, dashboard, surveys, profile, regression]

    steps:
      - name: '🛎️ Checkout Repository'
        uses: actions/checkout@v4

      - name: '⚙️ Setup Node.js'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: '📦 Install Dependencies'
        run: |
          npm ci --prefix selenium-tests 2>/dev/null || npm install --prefix selenium-tests
          npm ci --prefix popc-web 2>/dev/null || npm install --prefix popc-web

      - name: '🐍 Setup Python & Django Backend'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: '🗄️ Install Backend Dependencies'
        run: |
          pip install -r popc/requirements.txt 2>/dev/null || echo "Backend requirements skipped"
        continue-on-error: true

      - name: '🖥️ Install Chrome'
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: '🔍 Verify Chrome'
        run: google-chrome --version

      - name: '🚀 Start Backend Server'
        run: |
          cd popc
          python manage.py migrate --no-input 2>/dev/null || echo "Migration skipped"
          python manage.py runserver 0.0.0.0:8000 &
          sleep 5
          curl -f http://localhost:8000/ || echo "Backend may not be running"
        continue-on-error: true

      - name: '🌐 Start Frontend Dev Server'
        run: |
          npm run dev --prefix popc-web &
          sleep 8
          curl -f http://localhost:5173/ || echo "Frontend server starting..."
        continue-on-error: true

      - name: '🧪 Run Test Suite — ${{ matrix.suite }}'
        run: |
          cd selenium-tests
          node runners/testRunner.js --suite=${{ matrix.suite }}
        env:
          BASE_URL: ${{ env.BASE_URL }}
          API_URL: ${{ env.API_URL }}
          BROWSER: chrome
          HEADLESS: 'true'
          TEST_USERNAME: ${{ env.TEST_USERNAME }}
          TEST_PASSWORD: ${{ env.TEST_PASSWORD }}
        continue-on-error: true

      - name: '📊 Generate Reports for ${{ matrix.suite }}'
        if: always()
        run: |
          cd selenium-tests
          node utils/generateReports.js
        continue-on-error: true

      - name: '📤 Upload Test Artifacts — ${{ matrix.suite }}'
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selenium-results-${{ matrix.suite }}-${{ github.run_number }}
          path: |
            selenium-tests/reports/
            selenium-tests/screenshots/
            selenium-tests/logs/
          retention-days: 30

  # ────────────────────────────────────────────────────────
  # STAGE 4: Merge Reports & Generate Final
  # ────────────────────────────────────────────────────────
  generate-reports:
    name: '📊 Generate Final Reports'
    runs-on: ubuntu-latest
    needs: e2e-tests
    if: always()
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: '📦 Install Dependencies'
        run: npm ci --prefix selenium-tests 2>/dev/null || npm install --prefix selenium-tests

      - name: '⬇️ Download All Suite Artifacts'
        uses: actions/download-artifact@v4
        with:
          pattern: selenium-results-*-${{ github.run_number }}
          path: downloaded-results/
          merge-multiple: true
        continue-on-error: true

      - name: '📊 Merge & Generate Reports'
        run: |
          cd selenium-tests
          # Merge raw results from all suites
          node -e "
          const fs = require('fs');
          const path = require('path');
          const base = '../downloaded-results';
          let all = [];
          if (fs.existsSync(base)) {
            const dirs = fs.readdirSync(base, {withFileTypes:true}).filter(d=>d.isDirectory());
            dirs.forEach(d => {
              const f = path.join(base, d.name, 'raw-results.json');
              if (fs.existsSync(f)) {
                const data = JSON.parse(fs.readFileSync(f,'utf8'));
                all = all.concat(data);
              }
            });
          }
          fs.mkdirSync('reports', {recursive:true});
          fs.writeFileSync('reports/raw-results.json', JSON.stringify(all,null,2));
          console.log('Merged', all.length, 'test results');
          "
          node utils/generateReports.js

      - name: '📤 Upload Final Reports'
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selenium-final-report-${{ github.run_number }}
          path: |
            selenium-tests/reports/
            selenium-tests/screenshots/
          retention-days: 30

      - name: '📝 GitHub Actions Summary'
        if: always()
        run: |
          cd selenium-tests
          node -e "
          const {getSummary} = require('./utils/testTracker');
          const s = getSummary();
          const md = \`
          # 🧪 POPC Selenium E2E Execution Summary

          | | |
          |---|---|
          | **Build Number** | ${{ github.run_number }} |
          | **Commit** | ${{ github.sha }} |
          | **Branch** | ${{ github.ref_name }} |
          | **Date** | \${new Date().toISOString()} |

          ## Test Results

          | Metric | Count |
          |--------|-------|
          | 📦 Total Tests | \${s.total} |
          | ✅ Passed | \${s.passed} |
          | ❌ Failed | \${s.failed} |
          | ⊖ Skipped | \${s.skipped} |
          | 📊 Pass Rate | \${s.passRate} |
          | ⏱ Duration | \${s.totalDuration} |

          ## Status
          \${parseFloat(s.passRate) >= 95 ? '✅ **PASSED** — Test suite passed quality gate (≥ 95%)' : '❌ **FAILED** — Test suite below 95% pass rate threshold'}
          \`;
          require('fs').writeFileSync('/tmp/gh-summary.md', md);
          " 2>/dev/null || echo "Summary generation skipped"
          cat /tmp/gh-summary.md >> \$GITHUB_STEP_SUMMARY 2>/dev/null || true

  # ────────────────────────────────────────────────────────
  # STAGE 5: Deploy to GitHub Pages
  # ────────────────────────────────────────────────────────
  deploy-pages:
    name: '🌐 Deploy Reports to GitHub Pages'
    runs-on: ubuntu-latest
    needs: generate-reports
    if: github.ref == 'refs/heads/main' && always()
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
        continue-on-error: true

      - uses: actions/checkout@v4
        with:
          path: source

      - name: '⬇️ Download Final Report'
        uses: actions/download-artifact@v4
        with:
          name: selenium-final-report-${{ github.run_number }}
          path: downloaded-report/
        continue-on-error: true

      - name: '📁 Prepare GitHub Pages'
        run: |
          mkdir -p reports/latest
          mkdir -p reports/history/build-${{ github.run_number }}

          # Copy latest reports
          if [ -d "downloaded-report/HTML" ]; then
            cp -r downloaded-report/HTML/* reports/latest/ 2>/dev/null || true
          fi
          if [ -d "downloaded-report" ]; then
            cp -r downloaded-report/* reports/latest/ 2>/dev/null || true
          fi

          # Archive to history
          cp -r reports/latest/* reports/history/build-${{ github.run_number }}/ 2>/dev/null || true

          # Create index.html
          cat > index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta http-equiv="refresh" content="0; url=reports/latest/execution-report.html">
            <title>POPC Selenium Reports</title>
            <style>body{font-family:sans-serif;text-align:center;padding:40px;background:#1E3A5F;color:white}</style>
          </head>
          <body>
            <h1>🧪 POPC Selenium E2E Reports</h1>
            <p>Redirecting to latest report...</p>
            <a href="reports/latest/execution-report.html" style="color:#64B5F6">View Latest Report</a>
          </body>
          </html>
          EOF

      - name: '🚀 Deploy to GitHub Pages'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          keep_files: true
          commit_message: '📊 Deploy Selenium E2E Reports — Build #${{ github.run_number }}'
        continue-on-error: true
