name: 🧪 Selenium E2E Tests — POPC Web Application

on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main, develop, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  NODE_VERSION: '20'

jobs:
  selenium-e2e:
    name: '🧪 Selenium Web E2E Pipeline'
    runs-on: ubuntu-latest

    steps:
      - name: 🛎️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install Selenium Test Dependencies
        run: |
          cd selenium-tests
          npm install

      - name: 🧪 Execute Selenium E2E Test Suite (400 Test Cases)
        run: |
          cd selenium-tests
          node runners/testRunner.js --suite=all
        continue-on-error: true

      - name: 📊 Generate Reports
        if: always()
        run: |
          cd selenium-tests
          node utils/generateReports.js
        continue-on-error: true

      - name: 📤 Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selenium-web-reports-${{ github.run_number }}
          path: |
            selenium-tests/reports/
            selenium-tests/screenshots/
          retention-days: 30

      - name: 🌐 Publish Reports to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main' && always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./selenium-tests/reports
          destination_dir: web-reports/latest
          keep_files: true
        continue-on-error: true
